<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#253044;background:#f6f7fa;font-size:13px;--blue:#4266e8;--muted:#8590a2;--line:#e7eaf0;--row:43px}*{box-sizing:border-box}body{margin:0;min-width:1040px}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid #dfe4ed;background:white;border-radius:6px;padding:7px 11px;color:#42506a;white-space:nowrap}button:hover{background:#f0f3fc;border-color:#bcc9f0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}.review{height:36px;background:#edf1ff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#52669c;font-size:11px}.review strong{font-size:11px;color:#3d5493}.review button{padding:2px 8px;font-size:11px;background:transparent;border-color:#cfd7f2}.app{height:calc(100vh - 36px);min-height:680px;display:grid;grid-template-columns:172px 1fr;grid-template-rows:64px 1fr 30px}.sidebar{grid-row:1/4;background:#fcfcfe;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 12px}.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:750;color:#253554;margin:0 8px 35px}.logo{display:grid;place-items:center;width:28px;height:28px;background:var(--blue);border-radius:8px;color:white;font-size:21px}.section-label{font-size:10px;font-weight:600;letter-spacing:1.5px;color:#a2aab9;padding:0 15px;margin-bottom:12px}.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 15px;margin-bottom:6px;text-align:left;color:#6f798c}.nav.active{background:#eaf0ff;color:#365ed6;font-weight:650}.icon{width:17px;height:17px;display:inline-block;flex-shrink:0;vertical-align:middle}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.side-note{font-size:10px;color:#9aa3b3;padding:8px 15px;line-height:1.8}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:white}.project{display:flex;align-items:center;gap:12px}.project span{font-size:11px;color:#8d97a7}.project select{border:0;background:#f5f7fb;font-weight:600;border-radius:6px;padding:8px 28px 8px 10px;color:#394862}.cluster{display:flex;align-items:center;gap:10px}.dot{width:6px;height:6px;border-radius:50%;background:#9ba7b9;display:inline-block;margin-right:7px}.dot.green{background:#23a888}.muted{color:var(--muted)}.tiny{font-size:11px}.mono{font-family:Consolas,"SFMono-Regular",monospace}.main{overflow:hidden;display:flex;flex-direction:column;min-width:0}.heading{height:93px;padding:23px 26px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}h1{font-size:22px;letter-spacing:-.5px;margin:0 0 7px;font-weight:650}h2{font-size:15px;margin:0 0 8px;font-weight:650}h3{font-size:12px;margin:0 0 12px;font-weight:600}.subtitle{font-size:11px;color:#8a95a6}.toolbar{padding:0 26px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}.seg{display:inline-flex;background:#eceff5;border-radius:7px;padding:3px;gap:2px}.seg button{border:0;background:transparent;padding:6px 12px;font-size:12px}.seg button.selected{background:white;box-shadow:0 1px 3px #26365016;color:#4266da}.filter{border:1px solid var(--line);background:white;border-radius:6px;padding:8px 10px;color:#58667d;min-width:110px}.search{min-width:160px;width:220px}.toolbar .spacer{flex:1}.workspace{margin:0 26px 20px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(390px,1fr) 365px;border:1px solid var(--line);border-radius:10px;background:white;overflow:hidden}.list-pane{min-width:0;overflow:auto}.detail{border-left:1px solid var(--line);overflow:auto;padding:21px;background:#fff}.pane-head{height:43px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#8792a4;font-size:11px;background:#fcfdff}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th{text-align:left;height:33px;font-weight:500;font-size:10px;color:#99a2b1;background:#fafbfd;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:0}.table td{height:var(--row);border-bottom:1px solid #f0f2f6;padding:6px 10px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table tr[data-flow],.table tr[data-device]{cursor:pointer}.table tr:hover td{background:#f7f9fe}.table tr.active td{background:#eef3ff}.method{font-size:9px;font-weight:700;color:#3a897b;letter-spacing:.2px}.method.post{color:#d18c38}.status{display:inline-block;font-size:10px;padding:3px 6px;border-radius:4px;background:#edf8f3;color:#27886d}.status.error{background:#fff0f0;color:#cf6161}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:4px;color:#63748c;background:#f0f3f7}.tag.blue{background:#edf1ff;color:#5a74c7}.tag.orange{background:#fff4e6;color:#bd843c}.tag.gray{background:#f0f2f6;color:#8590a2}.detail-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.url{font-size:11px;line-height:1.7;background:#f6f8fc;border:1px solid #edf0f5;border-radius:6px;padding:10px;margin:15px 0;color:#697b98;overflow-wrap:anywhere}.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:11px 10px;font-size:11px;line-height:1.45;margin:18px 0}.kv dt{color:#949ead}.kv dd{margin:0;overflow-wrap:anywhere}.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:24px;gap:19px}.tabs button{border:0;border-radius:0;padding:0 0 11px;font-size:12px;color:#8994a6;background:transparent}.tabs button.selected{color:var(--blue);border-bottom:2px solid var(--blue)}pre{font:11px/1.9 Consolas,monospace;background:#fafbfd;color:#4e637f;padding:16px;border:1px solid #edf0f5;border-radius:7px;overflow:auto;tab-size:2;white-space:pre-wrap;overflow-wrap:anywhere}.code-green{color:#258e73}.note{font-size:11px;color:#8290a5;line-height:1.8;padding:12px;background:#f7f9fd;border-radius:6px;margin:15px 0}.detail-footer{border-top:1px solid var(--line);padding-top:16px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}.bottom{border-top:1px solid var(--line);background:#fcfcfe;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:10px;color:#93a0b3}.empty{display:grid;place-content:center;min-height:180px;text-align:center;color:#9aa4b5;font-size:12px;gap:10px}.empty strong{color:#63738c}.tree-group{border-bottom:1px solid var(--line)}.tree-group summary{padding:14px 17px;color:#5b6e8a;font:11px Consolas,monospace;cursor:pointer;background:#fbfcfe}.tree-path{padding:8px 25px;color:#97a1b1;font:10px Consolas,monospace}.tree-leaf{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:0;padding:11px 18px 11px 35px;text-align:left;font-size:11px}.tree-leaf.active{background:#eef3ff}.tree-leaf .grow{flex:1}.tree-leaf .muted{font-size:10px}.cards{padding:17px}.info-card{border:1px solid var(--line);border-radius:8px;padding:17px;margin-bottom:12px}.info-card p{font-size:11px;color:#8a96aa;line-height:1.8;margin:8px 0 0}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.rule-card{padding:17px;border-bottom:1px solid var(--line);cursor:pointer}.rule-card.active{background:#f1f5ff;border-left:3px solid #6480ea;padding-left:14px}.rule-card h3{margin:0 0 8px}.rule-card p{margin:0;color:#8693a9;font-size:11px}.form-label{display:block;color:#8a97a9;font-size:11px;margin:17px 0 7px}.field{width:100%;border:1px solid #e0e6ef;border-radius:6px;padding:9px 10px;background:white;color:#53617a}.field-row{display:grid;grid-template-columns:90px 1fr;gap:8px}.editor{min-height:160px;font:11px/1.8 Consolas,monospace;resize:vertical;background:#fafbfd}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.step{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid var(--line);align-items:center}.step-num{width:29px;height:29px;border-radius:50%;background:#f0f3f9;color:#8a9bb5;display:grid;place-items:center;font-size:12px}.step.current .step-num{background:#eaf0ff;color:#5474dd}.step.done .step-num{background:#eaf7f2;color:#35a486}.step-text{flex:1}.step-text h3{margin:0 0 6px}.step-text small{font-size:10px;color:#8d99ad}.order-button{padding:4px 7px}.progress{height:4px;background:#edf0f5;border-radius:3px;overflow:hidden;margin:20px 0}.progress>i{display:block;width:33.33%;background:#5c81e3;height:4px}.notice{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:#283751;color:white;padding:12px 18px;border-radius:8px;font-size:12px;box-shadow:0 6px 25px #20304a25;z-index:5;max-width:600px}dialog{border:1px solid var(--line);border-radius:12px;width:450px;padding:26px;color:#344462;box-shadow:0 15px 80px #1c305a25}dialog::backdrop{background:#26385735}dialog p{font-size:12px;line-height:1.9;color:#8290a3}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.inline-msg{font-size:11px;color:#cc6767;min-height:18px;margin-top:8px}.review-links{display:flex;align-items:center;gap:12px}.cozy{--row:55px}.cozy .rule-card{padding-top:22px;padding-bottom:22px}@media(min-width:1550px){.workspace{grid-template-columns:minmax(460px,1fr) 420px}.detail{padding:26px}.table td{font-size:12px}.table th{font-size:11px}}@media(max-width:1180px){.app{grid-template-columns:152px 1fr}.workspace{margin:0 18px 18px;grid-template-columns:minmax(350px,1fr) 320px}.heading,.topbar{padding-left:18px;padding-right:18px}.toolbar{padding-left:18px;padding-right:18px}.brand{font-size:14px}.sidebar{padding-left:7px;padding-right:7px}.search{width:160px}.detail{padding:17px}}
</style>
</head>
<body>
<div class="review"><div><strong>UI 评审 · 02</strong>　四模块交互设计稿 · 所有数据与状态均为演示，未连接真实代理</div><div class="review-links"><span>信息密度</span><button id="density">紧凑 / 舒适</button><button id="guide">评审指南</button></div></div>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="logo">≈</span> MockCharles</div><div class="section-label">WORKSPACE</div><nav id="nav"></nav><div class="side-bottom"><button class="nav" id="settings">⚙　应用设置</button><div class="side-note">LOCAL WORKSPACE<br>本机工作区 · 设计预览</div></div></aside>
<header class="topbar"><div class="project"><span>查看项目</span><select id="project" aria-label="查看项目"><option>商城 App</option><option>会员中心</option></select></div><div class="cluster"><span class="tiny muted" id="proxyLabel"><i class="dot"></i>代理未开启</span><button id="proxy">开启代理</button></div></header>
<main class="main" id="main"></main><footer class="bottom"><span>● 演示会话　<span id="footCount">8 条请求</span></span><span>流量仅保留本次会话　·　目录式可导出</span></footer>
</div>
<dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions"><button id="closeDialog">关闭</button></div></dialog><div class="notice" id="toast" hidden role="status"></div>
<script>
const icons={devices:'M3 4h11v14H3z M6 15h5 M17 7h4v11h-4',rules:'M4 6h16 M4 12h16 M4 18h16 M9 3v6 M16 9v6 M8 15v6',sets:'M4 3h6v6H4z M14 15h6v6h-6z M7 9v9h7',traffic:'M2 12h4l3-8 5 16 3-8h5'};
const pages={devices:'设备管理',rules:'规则管理',sets:'规则集管理',traffic:'流量'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${icons[n].split(' M').map((p,i)=>`<path d="${i?'M':''}${p}"/>`).join('')}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flows=[
{id:1,ip:'192.168.1.108',project:'商城 App',method:'GET',host:'api.shop.test',path:'/v1/products',query:'page=1',status:200,ms:24,source:'固定 Mock',time:'10:42:18',body:{code:0,data:{items:[{id:'P-1001',name:'轻量旅行背包',price:299}],total:1}}},
{id:2,ip:'192.168.1.108',project:'商城 App',method:'POST',host:'api.shop.test',path:'/v1/cart',query:'',status:200,ms:42,source:'真实服务',time:'10:42:20',body:{code:0,data:{count:1}}},
{id:3,ip:'192.168.1.109',project:'会员中心',method:'GET',host:'api.member.test',path:'/v1/profile',query:'',status:200,ms:86,source:'真实服务',time:'10:42:21',body:{code:0,data:{name:'测试会员'}}},
{id:4,ip:'192.168.1.108',project:'商城 App',method:'GET',host:'api.shop.test',path:'/v1/products',query:'page=2',status:200,ms:18,source:'随机 Mock',time:'10:42:23',body:{code:0,data:{items:[{id:'P-1021',price:199},{id:'P-1022',price:359}]}}},
{id:5,ip:'192.168.1.110',project:'未绑定',method:'GET',host:'api.shop.test',path:'/v1/products',query:'page=1',status:200,ms:143,source:'真实服务',time:'10:42:25',body:null,reason:'正文未捕获'},
{id:6,ip:'192.168.1.108',project:'商城 App',method:'POST',host:'api.shop.test',path:'/v1/orders',query:'',status:500,ms:12,source:'随机 Mock',time:'10:42:27',body:{code:'MOCK_GENERATION_FAILED',message:'唯一值数量不足'},reason:'生成失败，步骤未推进'},
{id:7,ip:'192.168.1.109',project:'会员中心',method:'GET',host:'api.member.test',path:'/v1/benefits',query:'',status:null,ms:null,source:'真实服务',time:'10:42:29',body:null,reason:'请求进行中'},
{id:8,ip:'192.168.1.108',project:'商城 App',method:'GET',host:'api.shop.test',path:'/v1/products',query:'page=3',status:200,ms:21,source:'固定 Mock',time:'10:42:31',body:{code:0,data:{items:[],total:0}}}
];
const state={page:'traffic',view:'stream',ip:'all',project:'商城 App',trafficProject:'all',q:'',selected:1,tab:'response',device:'192.168.1.108',ruleTab:'interface',setType:'priority',proxy:false,order:['商品列表 · 正常返回','商品列表 · 空数据','加入购物车'],label:'iPhone · 商城测试',binding:'独立 Mock'};
let toastTimer;
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4000)}
function dialog(title,html){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=html;document.getElementById('dialog').showModal()}
document.getElementById('closeDialog').onclick=()=>document.getElementById('dialog').close();
document.getElementById('density').onclick=()=>document.body.classList.toggle('cozy');
document.getElementById('guide').onclick=()=>dialog('本轮请评审这三件事','<p>① 四模块导航和列表＋详情的布局是否顺手？<br>② 信息密度选择紧凑还是舒适？<br>③ 流量目录是否按域名 / 路径组织，并与流式共用详情？</p><p>可以切换全部 / 单 IP、目录 / 流式，编辑演示备注和响应，查看顺序运行与导出预览。代理、保存、运行均为演示，不操作真实设备。</p>');
document.getElementById('settings').onclick=()=>dialog('应用设置','<p>监听地址与端口、会话缓存容量、MCP 接入和诊断将放在这里。</p><p>本轮评审四个业务页面；设置详细参数在对应功能实现前细化。</p>');
document.getElementById('project').onchange=e=>{state.project=e.target.value;render();notify('已切换查看项目，设备绑定与流量范围不变')};
document.getElementById('proxy').onclick=()=>{state.proxy=!state.proxy;document.getElementById('proxy').textContent=state.proxy?'停止代理':'开启代理';document.getElementById('proxyLabel').innerHTML=state.proxy?'<i class="dot green"></i>演示：监听中':'<i class="dot"></i>代理未开启';if(!state.proxy)Object.values(deviceModels).forEach(d=>d.running=false);render();notify('仅演示监听状态，未开启真实代理')};
function render(){document.getElementById('nav').innerHTML=Object.entries(pages).map(([k,n])=>`<button class="nav ${state.page===k?'active':''}" data-page="${k}">${icon(k)}${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});({traffic:renderTraffic,devices:renderDevices,rules:renderRules,sets:renderSets})[state.page]();}
function title(name,sub,action=''){return `<div class="heading"><div><h1>${name}</h1><div class="subtitle">${sub}</div></div>${action}</div>`}
function filtered(){return flows.filter(f=>(state.ip==='all'||f.ip===state.ip)&&(state.trafficProject==='all'||f.project===state.trafficProject)&&(`${f.host}${f.path}?${f.query} ${f.method} ${f.status}`.toLowerCase().includes(state.q.toLowerCase())))}
function code(f){return f.status===null?'<span class="muted">进行中</span>':`<span class="status ${f.status>=400?'error':''}">${f.status}</span>`}
function renderTraffic(){const fs=filtered();if(!fs.some(f=>f.id===state.selected))state.selected=fs[0]?.id??null;
document.getElementById('main').innerHTML=title('流量','观察本次会话中的请求，追踪每一次真实与 Mock 响应。',`<span class="tag gray">本次会话</span>`)+`<div class="toolbar"><select id="ip" class="filter" aria-label="设备范围"><option value="all">全部 IP</option>${['192.168.1.108','192.168.1.109','192.168.1.110','192.168.1.111'].map(ip=>`<option value="${ip}" ${state.ip===ip?'selected':''}>${ip}</option>`).join('')}</select><select id="trafficProject" class="filter" aria-label="流量项目"><option value="all">全部项目</option>${['商城 App','会员中心','未绑定'].map(p=>`<option ${state.trafficProject===p?'selected':''}>${p}</option>`).join('')}</select><input id="search" class="filter search" aria-label="搜索流量" placeholder="搜索域名、路径或状态码" value="${esc(state.q)}"><span class="spacer"></span><div class="seg"><button id="stream" class="${state.view==='stream'?'selected':''}">流式</button><button id="tree" class="${state.view==='tree'?'selected':''}">目录式</button></div>${state.view==='tree'?'<button id="export">导出</button>':''}</div><section class="workspace"><div class="list-pane"><div class="pane-head"><span>${state.view==='tree'?'域名与路径':'请求序列'} <span class="mono">/ ${fs.length}</span></span><span>${state.ip==='all'?'全部来源':state.ip}</span></div>${fs.length?(state.view==='tree'?treeHTML(fs):tableHTML(fs)):'<div class="empty"><strong>没有匹配的请求</strong><span>调整设备、项目或搜索条件</span></div>'}</div><aside class="detail">${detailHTML(flows.find(f=>f.id===state.selected))}</aside></section>`;
document.getElementById('ip').onchange=e=>{state.ip=e.target.value;renderTraffic()};document.getElementById('trafficProject').onchange=e=>{state.trafficProject=e.target.value;renderTraffic()};document.getElementById('search').oninput=e=>{state.q=e.target.value;const pos=e.target.selectionStart;renderTraffic();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)};
document.getElementById('stream').onclick=()=>{state.view='stream';renderTraffic()};document.getElementById('tree').onclick=()=>{state.view='tree';renderTraffic()};document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.flow);renderTraffic()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTraffic()});
const e=document.getElementById('export');if(e)e.onclick=()=>dialog('导出当前目录范围',`<p>设备：${state.ip==='all'?'全部 IP':esc(state.ip)}<br>项目：${state.trafficProject==='all'?'全部项目':esc(state.trafficProject)}<br>当前筛选：${fs.length} 条请求</p><div class="note">此处演示导出范围确认。文件格式将在导出设计中确定；不会生成真实文件。未完成或缺失正文的请求需在导出结果中明确标记。</div>`);
const create=document.getElementById('createRule');if(create)create.onclick=()=>{state.page='rules';state.ruleTab='interface';const f=flows.find(f=>f.id===state.selected);state.ruleDraft={project:state.project,flow:f};render();notify(`已从 ${f.path} 打开演示草稿；保存目标为查看项目 ${state.project}`)};
document.getElementById('footCount').textContent=`${fs.length} / ${flows.length} 条请求`;
}
function tableHTML(fs){return `<table class="table"><thead><tr><th style="width:60px">方法</th><th>接口</th><th style="width:59px">状态</th><th style="width:122px">来源 IP</th><th style="width:75px">响应来源</th><th style="width:51px">耗时</th></tr></thead><tbody>${fs.map(f=>`<tr data-flow="${f.id}" class="${state.selected===f.id?'active':''}"><td><span class="method ${f.method==='POST'?'post':''}">${f.method}</span></td><td><span class="mono">${f.path.split('/').pop()}${f.query?'?'+f.query:''}</span><div class="muted tiny" style="margin-top:4px">${f.host}</div></td><td>${code(f)}</td><td class="mono tiny">${f.ip}</td><td><span class="${f.source.includes('Mock')?'tag blue':'muted'}">${f.source}</span></td><td class="mono muted">${f.ms===null?'—':f.ms+'ms'}</td></tr>`).join('')}</tbody></table>`}
function treeHTML(fs){return [...new Set(fs.map(f=>f.host))].map(host=>`<details class="tree-group" open><summary>https://${host} <span class="muted">(${fs.filter(f=>f.host===host).length})</span></summary>${[...new Set(fs.filter(f=>f.host===host).map(f=>f.path))].map(path=>`<div class="tree-path">└ ${path}</div>${fs.filter(f=>f.host===host&&f.path===path).map(f=>`<button class="tree-leaf ${state.selected===f.id?'active':''}" data-flow="${f.id}"><span class="method ${f.method==='POST'?'post':''}">${f.method}</span><span class="grow mono">${f.query||'请求 #'+f.id}</span>${code(f)}<span class="muted mono">${f.ip} · ${f.time}</span></button>`).join('')}`).join('')}</details>`).join('')}
function detailHTML(f){if(!f)return '<div class="empty">请选择一条请求</div>';const mock=f.source.includes('Mock');const text=state.tab==='request'?JSON.stringify({method:f.method,query:f.query,headers:{Accept:'application/json'}},null,2):state.tab==='headers'?JSON.stringify({'Content-Type':'application/json',...(f.project!=='未绑定'?{'X-Environment':'testing'}:{})},null,2):f.body?JSON.stringify(f.body,null,2):null;return `<div class="detail-title"><div><h2>${f.path.split('/').pop()}</h2><span class="method ${f.method==='POST'?'post':''}">${f.method}</span> <span class="tiny muted">${f.time}</span></div>${code(f)}</div><div class="url mono">https://${f.host}${f.path}${f.query?'?'+f.query:''}</div><dl class="kv"><dt>来源设备</dt><dd class="mono">${f.ip}</dd><dt>所属项目</dt><dd>${f.project}</dd><dt>响应来源</dt><dd><span class="tag ${mock?'blue':''}">${f.source}</span></dd><dt>命中说明</dt><dd>${f.reason||(mock?'商品列表规则 · 优先级 1':'未命中 Mock，转发真实服务')}</dd>${mock?'<dt>使用版本</dt><dd class="mono">响应 v3 · 本次已选定</dd>':''}</dl><div class="tabs"><button data-tab="response" class="${state.tab==='response'?'selected':''}">响应</button><button data-tab="request" class="${state.tab==='request'?'selected':''}">请求</button><button data-tab="headers" class="${state.tab==='headers'?'selected':''}">Header</button></div>${text?`<pre>${esc(text)}</pre>`:`<div class="empty"><strong>${f.reason||'正文不可用'}</strong><span>不会使用当前模板重建此响应</span></div>`}<div class="detail-footer"><span class="tiny muted">本次实际结果 · 演示</span><button id="createRule" ${!f.body?'disabled':''}>创建接口规则 ↗</button></div>`}
const setCatalog={
  'shop-default':{name:'商城默认规则',project:'商城 App',mode:'独立 Mock'},
  'shop-order':{name:'下单流程',project:'商城 App',mode:'顺序执行'},
  'member-default':{name:'会员默认规则',project:'会员中心',mode:'独立 Mock'}
};
const deviceModels={
  '192.168.1.108':{label:'iPhone · 商城测试',project:'商城 App',linked:['shop-default','shop-order'],selected:'shop-default',active:'shop-default',running:false,cursor:0},
  '192.168.1.109':{label:'Android · 会员测试',project:'会员中心',linked:['member-default'],selected:'member-default',active:null,running:false,cursor:0},
  '192.168.1.110':{label:'未命名设备',project:'未绑定',linked:[],selected:null,active:null,running:false,cursor:0},
  '192.168.1.111':{label:'Android · 商城回归',project:'商城 App',linked:['shop-default','shop-order'],selected:'shop-order',active:null,running:false,cursor:0}
};
function deviceMode(d){return d.active?setCatalog[d.active].mode:'真实转发'}
function deviceStatus(d){return !d.active?'未启用 · 真实转发':!state.proxy?'配置已启用 · 等待开启代理':deviceMode(d)==='顺序执行'?(d.running?'运行中':'待手动开始'):'规则已启用'}
function renderDevices(){
  const chosen=state.device,d=deviceModels[chosen],candidate=d.selected?setCatalog[d.selected]:null;
  document.getElementById('main').innerHTML=title('设备管理','接入设备，在设备侧选择并启用规则集。','<span class="tag">4 个来源 IP</span>')+`
  <section class="workspace"><div class="list-pane"><div class="cards"><div class="info-card"><div class="card-top"><h2>连接到本机代理</h2><span class="tag gray">接入指南</span></div><div class="row-between" style="margin-top:16px"><span class="mono">192.168.1.20 : 8888</span><button id="cert">证书与安装指引 ↗</button></div><p>在手机 Wi-Fi 设置中配置 HTTP 代理。HTTPS 需要安装并信任本机证书。</p></div></div>
  <div class="pane-head"><span>设备来源</span><span>各设备独立启用 · 同时一个规则集</span></div>
  <table class="table"><thead><tr><th style="width:126px">来源 IP</th><th>备注 / 启用规则集</th><th style="width:82px">项目</th><th style="width:88px">模式</th></tr></thead><tbody>${Object.entries(deviceModels).map(([ip,x])=>`<tr data-device="${ip}" class="${ip===chosen?'active':''}"><td class="mono">${ip}</td><td>${esc(x.label)}<div class="tiny muted" style="margin-top:4px">${x.active?setCatalog[x.active].name:'未启用规则集'}</div></td><td>${x.project}</td><td><span class="tag ${x.active?'blue':''}">${deviceMode(x)}</span></td></tr>`).join('')}</tbody></table>
  <div class="cards"><div class="note">一个规则集可关联多台设备；每台设备只启用一个。启用或停止当前设备，不改变其他设备的配置与进度。</div></div></div>
  <aside class="detail"><h2>设备配置</h2><div class="subtitle mono">${chosen}</div>
  <label class="form-label" for="label">备注</label><input class="field" id="label" value="${esc(d.label)}">
  <label class="form-label">实际绑定项目</label><div class="field">${d.project}</div>
  <div class="row-between" style="margin-top:17px"><span class="tiny muted">已关联规则集 · ${d.linked.length}</span><button id="manageLinks" ${d.project==='未绑定'?'disabled':''}>管理关联</button></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${d.linked.map(id=>`<span class="tag">${setCatalog[id].name}</span>`).join('')||'<span class="tiny muted">请先绑定项目</span>'}</div>
  <label class="form-label" for="deviceSet">本次使用规则集</label><select class="field" id="deviceSet" ${!d.linked.length?'disabled':''}>${d.linked.length?d.linked.map(id=>`<option value="${id}" ${id===d.selected?'selected':''}>${setCatalog[id].name} · ${setCatalog[id].mode}</option>`).join(''):'<option value="">未关联</option>'}</select>
  <dl class="kv"><dt>实际启用</dt><dd>${d.active?setCatalog[d.active].name:'无'}</dd><dt>工作模式</dt><dd>${deviceMode(d)}</dd><dt>设备状态</dt><dd><span class="tag ${d.active?'blue':'gray'}">${deviceStatus(d)}</span></dd>${d.active&&deviceMode(d)==='顺序执行'?`<dt>当前步骤</dt><dd id="deviceStep">${d.cursor+1} / 3　${['浏览商品','加入购物车','创建订单'][d.cursor]}</dd>`:''}</dl>
  <div class="cluster"><button class="primary" id="run" ${!candidate||!state.proxy||(d.active===d.selected&&(candidate.mode==='独立 Mock'||d.running))?'disabled':''}>${candidate?.mode==='顺序执行'?'开始设备运行':'启用所选规则集'}</button><button id="stopDevice" ${!d.active?'disabled':''}>停止设备规则</button>${d.active&&deviceMode(d)==='顺序执行'?'<button id="reset">重置</button>':''}</div>
  <div class="note">选择候选不改变实际启用；点击启用或开始后替换本设备的当前规则集。${!state.proxy?'<br>开始前请先开启顶部代理。':''}<br>停止设备规则后真实转发，不关闭共享代理。${d.project==='未绑定'?'<br>未绑定项目不改写 Header。':''}</div>
  <div class="detail-footer"><button id="deviceFlows">查看此 IP 流量</button><button id="saveDevice">保存备注</button></div></aside></section>`;
  document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{state.device=b.dataset.device;renderDevices()});
  document.getElementById('deviceSet').onchange=e=>{d.selected=e.target.value;renderDevices()};
  document.getElementById('cert').onclick=()=>dialog('证书与安装指引','<p>本机 CA 供所有测试设备使用，只下载公共证书。安装信任需要在手机上完成。</p><div class="note">设计预览，不生成或安装真实证书。</div>');
  document.getElementById('saveDevice').onclick=()=>{d.label=document.getElementById('label').value;renderDevices();notify('演示备注已保存，未改变设备启用配置')};
  document.getElementById('run').onclick=()=>{d.active=d.selected;d.running=setCatalog[d.active].mode==='顺序执行';d.cursor=0;renderDevices();notify(`仅演示：${chosen} 已启用 ${setCatalog[d.active].name}，其他设备不变`)};
  document.getElementById('stopDevice').onclick=()=>{d.active=null;d.running=false;renderDevices();notify(`仅演示：停止 ${chosen} 的规则，保留关联与选择`)};
  const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{d.running=false;d.cursor=0;renderDevices();notify('仅重置当前设备到第一步，需手动开始；其他设备不变')};
  document.getElementById('manageLinks').onclick=()=>{dialog('管理此设备的关联规则集',`<p>${chosen} · ${d.project}<br>可关联多个，同一时间只启用一个。</p>${Object.entries(setCatalog).filter(([,s])=>s.project===d.project).map(([id,s])=>`<label style="display:block;margin:15px 0"><input type="checkbox" data-link="${id}" ${d.linked.includes(id)?'checked':''} ${d.active===id?'disabled':''}> ${s.name} <span class="tiny muted">${d.active===id?'当前启用，先停止再移除':s.mode}</span></label>`).join('')}<button class="primary" id="saveLinks">保存关联</button>`);document.getElementById('saveLinks').onclick=()=>{d.linked=[...document.querySelectorAll('[data-link]:checked')].map(x=>x.dataset.link);if(!d.linked.includes(d.selected))d.selected=d.linked[0]??null;document.getElementById('dialog').close();renderDevices();notify('演示关联已保存，不自动启用任何新规则集')};};
  document.getElementById('deviceFlows').onclick=()=>{state.ip=chosen;state.trafficProject='all';state.page='traffic';state.q='';render()};
}
function renderRules(){const member=state.project==='会员中心';const source=state.ruleDraft?.project===state.project?state.ruleDraft.flow:flows.find(f=>f.id===(member?3:1));document.getElementById('main').innerHTML=title('规则管理','定义接口响应与项目 Header，供规则集复用。','<button id="newRule">＋ 新建规则</button>')+`<div class="toolbar"><div class="seg"><button id="interface" class="${state.ruleTab==='interface'?'selected':''}">接口规则</button><button id="headerRules" class="${state.ruleTab==='headers'?'selected':''}">Header 规则</button></div><span class="tiny muted">当前查看：${state.project}</span></div><section class="workspace"><div class="list-pane"><div class="pane-head"><span>${state.ruleTab==='interface'?'项目接口规则':'项目通用 Header'}</span><span>定义与编排分开管理</span></div>${state.ruleTab==='interface'?`<div class="rule-card active"><div class="card-top"><h3>${state.ruleDraft?.project===state.project?'来自流量 · '+source.path:(member?'会员资料 · 正常返回':'商品列表 · 正常返回')}</h3><span class="tag blue">固定响应</span></div><p class="mono">${source.method}　${source.path}</p><p style="margin-top:12px">${member?'会员默认规则':'商城默认规则'} 引用 · 已保存 v3</p></div><div class="rule-card"><h3>${member?'权益列表':'商品列表 · 空数据'}</h3><p>备用接口规则 · 独立启用</p></div><div class="cards"><div class="note">规则定义只维护一份。优先级顺序在规则集管理；修改共享规则会影响引用它的设备。</div></div>`:'<div class="rule-card active"><div class="card-top"><h3>测试环境 Header</h3><span class="tag blue">项目通用</span></div><p>请求 / 响应 · 同一项目所有适用流量</p></div><div class="cards"><div class="note">未绑定项目不改写 Header。接口专用 Header 在项目通用规则之后覆盖。</div></div>'}</div><aside class="detail">${state.ruleTab==='interface'?`<div class="row-between"><h2>接口响应</h2><span class="tag gray">编辑草稿</span></div><label class="form-label">匹配条件</label><div class="field-row"><div class="field mono">${source.method}</div><div class="field mono">${source.path}</div></div><label class="form-label" for="responseMode">响应模式</label><select id="responseMode" class="field"><option>固定响应</option><option>随机响应</option></select><label class="form-label" for="responseBody">响应正文 · JSON</label><textarea id="responseBody" class="field editor">${esc(JSON.stringify(source?.body||{code:0,data:{items:[]}},null,2))}</textarea><div class="inline-msg" id="jsonError"></div><div class="note" id="responseHint">响应内容保存后，下一请求生效。<br>在途请求继续使用已选版本。</div><div class="detail-footer"><button id="preview">预览</button><button class="primary" id="saveRule">保存响应</button></div>`:`<h2>Header 操作</h2><label class="form-label">生效范围</label><div class="field">${state.project} · 项目通用</div><label class="form-label">方向与操作</label><div class="field">请求 Header · 设置</div><label class="form-label">字段名</label><div class="field mono">X-Environment</div><label class="form-label">字段值</label><input class="field mono" value="testing" aria-label="Header 字段值"><div class="note">保存后下一请求生效。在途请求保留已经选定的 Header 版本。</div><div class="detail-footer"><span class="tiny muted">接口专用规则最后覆盖</span><button class="primary" id="saveHeader">保存</button></div>`}</aside></section>`;document.getElementById('interface').onclick=()=>{state.ruleTab='interface';renderRules()};document.getElementById('headerRules').onclick=()=>{state.ruleTab='headers';renderRules()};document.getElementById('newRule').onclick=()=>notify('本轮展示规则编辑布局；新建表单在 UI 定稿后补齐');if(state.ruleTab==='interface'){const validate=()=>{try{const obj=JSON.parse(document.getElementById('responseBody').value);document.getElementById('jsonError').textContent='';return {ok:true,obj}}catch{document.getElementById('jsonError').textContent='JSON 格式不正确，请检查引号、逗号和括号。';return {ok:false}}};document.getElementById('preview').onclick=()=>{const r=validate();if(r.ok)dialog('草稿预览',`<pre>${esc(JSON.stringify(r.obj,null,2))}</pre><p>演示预览，不影响任何设备或步骤。</p>`)};document.getElementById('saveRule').onclick=()=>{if(validate().ok)notify('演示保存成功 · 响应下一请求生效')};document.getElementById('responseMode').onchange=e=>document.getElementById('responseHint').innerHTML=e.target.value==='随机响应'?'随机字段与列表模板将在此展开。<br>当前仅预览基础 JSON，不执行随机生成。':'响应内容保存后，下一请求生效。<br>在途请求继续使用已选版本。'}else document.getElementById('saveHeader').onclick=()=>notify('演示保存成功 · 项目 Header 下一请求生效')}
function renderSets(){
 const member=state.project==='会员中心',sequence=!member&&state.setType==='sequence';
 const setId=member?'member-default':sequence?'shop-order':'shop-default';
 const selectedSet=setCatalog[setId];const linked=Object.entries(deviceModels).filter(([,d])=>d.linked.includes(setId));
 document.getElementById('main').innerHTML=title('规则集管理','维护规则定义与编排；运行控制在设备管理中。','<span class="tag gray">'+state.project+'</span>')+`
 <div class="toolbar"><div class="seg"><button id="priority" class="${!sequence?'selected':''}">优先匹配</button><button id="sequence" class="${sequence?'selected':''}" ${member?'disabled':''}>顺序执行</button></div><span class="tiny muted">${sequence?'这里只编辑步骤定义，不展示全局运行游标':'按顺序选择第一条启用且匹配的规则'}</span></div>
 <section class="workspace"><div class="list-pane"><div class="pane-head"><span>${selectedSet.name}</span><span>${sequence?'顺序定义 v2':'定义 v4'}</span></div><div class="cards"><h2>${selectedSet.name}</h2><p class="tiny muted">${sequence?'各设备使用此定义独立运行，当前步骤在设备侧查看。':'调整优先级后保存，影响使用此集合的设备。'}</p>
 ${(sequence?['浏览商品','加入购物车','创建订单']:member?['会员资料','会员权益']:state.order).map((s,i)=>`<div class="step"><span class="step-num">${String(i+1).padStart(2,'0')}</span><div class="step-text"><h3>${esc(s)}</h3><small>${sequence?'步骤定义 · 已启用':'引用接口规则 · 已启用'}</small></div>${!sequence&&!member?`<button class="order-button" data-up="${i}" ${i===0?'disabled':''} aria-label="上移${esc(s)}">↑</button>`:'<span class="tag gray">启用</span>'}</div>`).join('')}
 <div class="detail-footer"><span class="tiny muted">${sequence?'顺序及步骤匹配：下次开始 / 重置生效':'优先顺序：保存后下一请求生效'}</span><button id="saveSet">保存编排</button></div></div></div>
 <aside class="detail"><h2>关联设备 <span class="tag">${linked.length}</span></h2><div class="subtitle">同一规则集可复用，启用与运行按设备独立。</div>
 ${linked.map(([ip,d])=>`<div class="info-card" style="margin-top:17px"><h3>${esc(d.label)}</h3><p class="mono tiny">${ip}</p><dl class="kv"><dt>使用状态</dt><dd><span class="tag ${d.active===setId?'blue':'gray'}">${d.active===setId?deviceStatus(d):'已关联 · 未启用本集合'}</span></dd>${d.active===setId&&sequence?`<dt>当前步骤</dt><dd>${d.cursor+1} / 3</dd>`:''}</dl><button data-go-device="${ip}">前往设备管理 ↗</button></div>`).join('')||'<div class="empty">暂无关联设备</div>'}
 <div class="note">关联不等于启用。请在设备页选择本次使用规则集，再启用或开始；这里不提供启动、停止或重置操作。</div></aside></section>`;
 document.getElementById('priority').onclick=()=>{state.setType='priority';renderSets()};document.getElementById('sequence').onclick=()=>{state.setType='sequence';renderSets()};
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.up);[state.order[i-1],state.order[i]]=[state.order[i],state.order[i-1]];renderSets()});
 document.getElementById('saveSet').onclick=()=>notify(sequence?'演示保存 · 编排下次开始或重置生效':'演示保存 · 优先顺序下一请求生效');
 document.querySelectorAll('[data-go-device]').forEach(b=>b.onclick=()=>{state.device=b.dataset.goDevice;state.page='devices';render()});
}
render();
</script>
