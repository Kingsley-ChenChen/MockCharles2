<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目录视图 · 设计方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#25324a;font:13px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid #4966ed;outline-offset:2px}button{background:#fff;border:1px solid #dfe5ef;border-radius:6px;padding:7px 12px;color:inherit}button:hover{background:#f2f5ff}header{padding:22px 32px 16px;background:white;border-bottom:1px solid #dfe5ef}header small{color:#8390a5;letter-spacing:2px;font-size:10px}h1{font-size:21px;margin:5px 0 14px;letter-spacing:-.5px}.choices{display:flex;gap:10px;flex-wrap:wrap}.choices button{padding:9px 16px}.choices .active{background:#344ecb;color:#fff;border-color:#344ecb}.recommend{font-size:10px;border:1px solid currentColor;border-radius:4px;margin-left:8px;padding:1px 4px}.explain{display:flex;justify-content:space-between;gap:25px;align-items:center;margin-top:14px;min-height:30px;color:#63738c;font-size:12px}.explain strong{color:#34415c;font-weight:600}.hint{white-space:nowrap;color:#8a96a9;font-size:11px}.app{margin:22px 28px;background:#f8f9fc;border:1px solid #dce3ee;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #2e42600a}.top{background:#fff;border-bottom:1px solid #e7ebf3;display:flex;justify-content:space-between;padding:13px 20px;align-items:center}.brand{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}.brand span{background:#4964ed;color:white;width:25px;height:25px;border-radius:7px;display:grid;place-items:center;font-size:21px}.live{color:#23876d;font-size:11px}.heading{padding:18px 22px 12px;display:flex;align-items:center;gap:10px}h2{font-size:18px;margin:0}.muted{color:#91a0b5}.toolbar{display:flex;gap:9px;align-items:center;padding:0 22px 16px;flex-wrap:wrap}.toolbar select,.toolbar input{border:1px solid #dfe5ef;background:white;border-radius:6px;padding:7px 10px;color:#52627a}.toolbar input{width:200px}.segment{display:flex;border:1px solid #dfe5ef;border-radius:6px;padding:2px;background:#f0f3f8}.segment span{padding:4px 12px;font-size:12px;color:#8894a7}.segment .on{background:white;color:#31446a;border-radius:4px;box-shadow:0 1px 3px #21324d12}.count{font-size:11px;color:#8e9cb0;margin-left:auto}.workspace{margin:0 22px 22px;border:1px solid #dfe5ef;border-radius:8px;background:#fff;display:grid;grid-template-columns:minmax(380px,1fr) 300px;height:510px;overflow:hidden}.browse{overflow:auto;min-width:0}.detail{border-left:1px solid #e6ebf3;padding:20px;overflow:auto}.detail h3{font-size:15px;margin:0 0 10px}.detail .url{overflow-wrap:anywhere;font:11px/1.7 Consolas,monospace;color:#6a7c98;margin:12px 0}.detail .statusline{display:flex;align-items:center;gap:8px;margin-bottom:20px}.detail label{font-size:11px;color:#8c98ac;display:block}.facts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0;font-size:12px}.detail h4{font-size:12px;margin:20px 0 8px}pre{font:11px/1.8 Consolas,monospace;background:#f8faff;border:1px solid #e9eef6;border-radius:6px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.tabline{display:flex;gap:17px;border-bottom:1px solid #e6ebf3;margin-top:24px;color:#8a99ae;font-size:11px}.tabline span{padding-bottom:9px}.tabline .selected{color:#4562df;border-bottom:2px solid #4562df}.method{display:inline-block;min-width:43px;text-align:center;padding:2px 5px;border-radius:4px;font:10px/1.4 Consolas,monospace;color:#168674;background:#eaf7f2;font-weight:bold}.method.tunnel{background:#f0f2f6;color:#8b97aa;min-width:62px}.code{font:11px Consolas,monospace;color:#238568}.code.bad{color:#ca555f}.code.dim{color:#a1abba}.time,.ip,.duration{font:11px Consolas,monospace;color:#8d9bb0}.domain{font-weight:600;color:#32435d;font-size:12px}.bubble{display:inline-flex;align-items:center;justify-content:center;min-width:20px;background:#f0f3f9;color:#8997af;font:10px/1.7 Consolas,monospace;border-radius:9px;padding:0 6px}.globe{color:#768cb6;font-size:16px;width:18px;display:inline-block;text-align:center}.folder{color:#acb9cf;font-size:14px}.arrow{color:#9caac0;font-size:10px}.headrow{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}.headrow::-webkit-details-marker{display:none}details[open]>summary .arrow{transform:rotate(90deg)}summary:hover{background:#f7f9fd}.spacer{flex:1}.row{display:grid;grid-template-columns:54px minmax(90px,1fr) 45px 55px 75px;gap:8px;align-items:center;text-align:left;width:100%;border:0;border-radius:0;background:transparent;min-height:35px;padding:5px 14px;font-size:11px}.row:hover{background:#f5f7fe}.row.pick{background:#edf2ff;box-shadow:inset 3px 0 #4a68ed}.row .ip{font-size:10px}.row .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#566983}.A{padding:8px 0}.A .host>summary{padding:9px 16px}.A .paths{margin-left:29px;border-left:1px solid #e9edf5}.A .path>summary{padding:7px 12px;color:#5a6c87;font:12px Consolas,monospace}.A .requests{padding-left:12px}.A .tunnels{margin:3px 0 5px 41px}.A .tunnels>summary{padding:6px 0;color:#95a1b3;font-size:11px}.A .row{min-height:33px}.B{padding:14px;background:#fafbfe}.B .card{border:1px solid #e2e7f0;border-radius:8px;margin-bottom:12px;overflow:hidden;background:white}.B .card>summary{padding:12px 14px;background:#fff}.B .card .sub{margin-left:26px;color:#8f9db2;font-size:10px}.B .path-title{padding:8px 14px;background:#f8faff;border-top:1px solid #eef1f6;font:11px Consolas,monospace;color:#6b7c96;display:flex;gap:8px}.B .row{min-height:38px}.B .tunnel-note{padding:8px 14px;color:#94a0b2;font-size:10px;border-top:1px solid #eef1f6}.C{display:grid;grid-template-columns:205px minmax(0,1fr);height:100%}.C .navtree{border-right:1px solid #e6ebf3;background:#fcfdff;padding:12px 8px;overflow:auto}.C .host>summary{padding:9px 5px;gap:5px}.C .domain{font-size:11px}.C .path-link{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;font:11px Consolas,monospace;padding:8px 10px 8px 30px}.C .path-link.active{background:#eaf0ff;color:#3e60d9;border-radius:5px}.C .requestpane{overflow:auto}.listcaption{padding:16px;border-bottom:1px solid #e8edf5}.listcaption strong{font-size:12px}.listcaption p{font-size:10px;color:#8d9bb0;margin:5px 0 0}.columns{display:grid;grid-template-columns:54px minmax(90px,1fr) 45px 55px 75px;gap:8px;padding:9px 14px;color:#9aa6b8;font-size:10px;background:#fafbfe}.bottom{display:flex;justify-content:space-between;border-top:1px solid #e7ebf3;padding:8px 22px;font-size:10px;color:#95a2b6;background:white}.empty{padding:35px;color:#91a0b5}.tip{padding:12px 16px;color:#94a2b6;font-size:10px;line-height:1.8}.hide-ip .ip{visibility:hidden}@media(max-width:1120px){.workspace{grid-template-columns:minmax(380px,1fr) 255px}.C{grid-template-columns:170px 1fr}.C .row,.C .columns{grid-template-columns:48px minmax(50px,1fr) 32px 46px}.C .row .time,.C .columns span:last-child{display:none}.app{margin:16px}header{padding:18px}.hint{display:none}}@media(max-width:780px){.workspace{grid-template-columns:1fr;height:570px}.detail{display:none}.explain{display:block}.count{display:none}.choices button{padding:7px}.app{margin:10px}.workspace{margin:0 10px 10px}.row{grid-template-columns:50px 1fr 34px 48px 66px;gap:5px;padding:5px 9px}}
</style>
<header><small>MOCKCHARLES / DESIGN REVIEW 02</small><h1>让目录层级更清楚，让请求更容易找到。</h1><div class="choices"><button data-mode="A" class="active">A · 紧凑树形<span class="recommend">推荐</span></button><button data-mode="B">B · 域名卡片</button><button data-mode="C">C · 目录 / 请求分栏</button></div><div class="explain"><div id="explanation"></div><span class="hint">可切换方案 · 折叠目录 · 点击请求查看详情</span></div></header>
<div class="app"><div class="top"><div class="brand"><span>≈</span> MockCharles</div><span class="live">● 正在抓包 · 0.0.0.0:8888</span></div><div class="heading"><h2>流量</h2><span class="muted">/ 本次会话</span></div><div class="toolbar"><select id="scope" aria-label="流量范围"><option value="all">所有设备流量</option><option value="one">192.168.1.5</option></select><div class="segment"><span>流式</span><span class="on">目录式</span></div><input id="search" placeholder="筛选域名或路径" aria-label="筛选域名或路径"><button id="collapse">全部折叠</button><span class="count">示例数据 · 非实时抓包</span></div><div class="workspace"><section class="browse" id="browse"></section><aside class="detail" id="detail"></aside></div><div class="bottom"><span>设计预览 · 不修改真实配置与流量</span><span id="footer">层级引导线 / 紧凑行高 / 对齐状态与耗时</span></div></div>
<script>
const data=[{host:'www.baidu.com',paths:[{path:'/',items:[{id:1,method:'GET',status:502,time:'14:18:16',ms:103},{id:2,method:'GET',status:200,time:'14:26:49',ms:128}]},{path:'/sugrec',items:[{id:3,method:'GET',status:200,time:'14:26:50',ms:86}]}],tunnels:4},{host:'t10.baidu.com',paths:[{path:'/',items:[]}],tunnels:2},{host:'t12.baidu.com',paths:[{path:'/',items:[]}],tunnels:1},{host:'m.baidu.com',paths:[{path:'/',items:[{id:4,method:'GET',status:200,time:'14:26:51',ms:92}]}],tunnels:2},{host:'hm.baidu.com',paths:[{path:'/hm.gif',items:[{id:5,method:'GET',status:204,time:'14:26:52',ms:43}]}],tunnels:1}];
const explanations={A:'<strong>保留熟悉的目录结构。</strong> 缩短行高，用引导线连接层级；方法、状态、耗时分列，隧道单独折叠。适合频繁抓包与快速定位。',B:'<strong>一个域名，一张卡片。</strong> 域名边界更明显，路径分组更轻松；留白较多，同屏可见请求相对少。',C:'<strong>左侧选目录，中间看请求，右侧看详情。</strong> 避免深层缩进，适合大量请求；会改变当前浏览方式，更适合宽窗口。'};
let mode='A',selected=2,pathHost='www.baidu.com',pathName='/',collapsed=false;
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rows(items){return items.map(i=>`<button class="row ${selected===i.id?'pick':''}" data-id="${i.id}"><span><b class="method ${i.method==='CONNECT'?'tunnel':''}">${i.method==='CONNECT'?'TUNNEL':i.method}</b></span><span class="label">${i.method==='CONNECT'?'加密隧道':'请求'} <span class="ip">· 192.168.1.5</span></span><span class="code ${i.status>=400?'bad':''}">${i.status}</span><span class="duration">${i.ms} ms</span><span class="time">${i.time}</span></button>`).join('')}
function tunnels(d){return Array.from({length:d.tunnels},(_,n)=>({id:d.host+'-'+n,host:d.host,method:'CONNECT',status:200,time:'14:17:59',ms:125+n}))}
function summary(d){return `<span class="arrow">▶</span><span class="globe">◎</span><span class="domain">${esc(d.host)}</span><span class="spacer"></span><span class="bubble">${d.paths.reduce((n,p)=>n+p.items.length,0)+d.tunnels}</span>`}
function render(){const q=$('#search').value.toLowerCase();const filtered=data.filter(d=>(d.host+' '+d.paths.map(p=>p.path).join(' ')).includes(q));$('#explanation').innerHTML=explanations[mode];$('#browse').className='browse '+mode+($('#scope').value==='one'?' hide-ip':'');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const open=collapsed?'':'open';
if(mode==='A')$('#browse').innerHTML=filtered.map(d=>`<details class="host" ${open}><summary class="headrow">${summary(d)}</summary><div class="paths">${d.paths.filter(p=>p.items.length).map(p=>`<details class="path" ${open}><summary class="headrow"><span class="arrow">▶</span><span class="folder">▱</span>${esc(p.path)}<span class="bubble">${p.items.length}</span></summary><div class="requests">${rows(p.items)}</div></details>`).join('')}</div><details class="tunnels"><summary class="headrow"><span class="arrow">▶</span>加密隧道 <span class="bubble">${d.tunnels}</span></summary>${rows(tunnels(d))}</details></details>`).join('');
if(mode==='B')$('#browse').innerHTML=filtered.map(d=>`<details class="card" ${open}><summary class="headrow">${summary(d)}</summary>${d.paths.filter(p=>p.items.length).map(p=>`<div class="path-title"><span class="folder">▱</span>${esc(p.path)}<span class="spacer"></span>${p.items.length} 条请求</div>${rows(p.items)}`).join('')}<details><summary class="headrow tunnel-note"><span class="arrow">▶</span>${d.tunnels} 条加密隧道 · 展开查看</summary>${rows(tunnels(d))}</details></details>`).join('');
if(mode==='C'){const d=filtered.find(d=>d.host===pathHost)||filtered[0];if(d){pathHost=d.host;if(!d.paths.some(p=>p.path===pathName))pathName=d.paths[0].path}const items=d?(d.paths.find(p=>p.path===pathName)?.items||[]):[];$('#browse').innerHTML=`<div class="navtree">${filtered.map(d=>`<details class="host" ${open}><summary class="headrow">${summary(d)}</summary>${d.paths.map(p=>`<button class="path-link ${d.host===pathHost&&p.path===pathName?'active':''}" data-host="${esc(d.host)}" data-path="${esc(p.path)}"><span class="folder">▱</span>${esc(p.path)}<span class="spacer"></span>${p.items.length}</button>`).join('')}</details>`).join('')}</div><div class="requestpane"><div class="listcaption"><strong>${d?esc(pathHost+pathName):'没有匹配目录'}</strong><p>${items.length} 条明文请求 · ${d?.tunnels||0} 条域名隧道</p></div><div class="columns"><span>方法</span><span>来源</span><span>状态</span><span>耗时</span><span>时间</span></div>${rows(items)}${d?`<details style="margin-top:12px"><summary class="headrow tip"><span class="arrow">▶</span>此域名的加密隧道（${d.tunnels}）</summary>${rows(tunnels(d))}</details>`:''}<p class="tip">选择左侧目录查看请求。每次请求独立保留，重复访问不会合并。</p></div>`}
if(!filtered.length && mode!=='C')$('#browse').innerHTML='<div class="empty">没有匹配的目录</div>';$('#footer').textContent={A:'层级引导线 / 紧凑行高 / 隧道折叠',B:'域名卡片 / 路径分区 / 更宽松的留白',C:'固定目录栏 / 请求分列 / 宽窗口优先'}[mode];
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=isNaN(Number(b.dataset.id))?b.dataset.id:Number(b.dataset.id);document.querySelectorAll('[data-id]').forEach(x=>x.classList.toggle('pick',x.dataset.id===b.dataset.id));showDetail()});document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{pathHost=b.dataset.host;pathName=b.dataset.path;render()});}
function showDetail(){let found,host,path;for(const d of data){for(const p of d.paths){let f=p.items.find(i=>i.id===selected);if(f){found=f;host=d.host;path=p.path}}const tunnel=tunnels(d).find(i=>i.id===selected);if(tunnel){found=tunnel;host=d.host;path=''}}if(!found)return;const i=found;$('#detail').innerHTML=`<label>请求详情</label><h3 style="margin-top:8px">${i.method==='CONNECT'?'加密隧道':path==='/'?'首页文档':'搜索建议'}</h3><div class="statusline"><span class="method ${i.method==='CONNECT'?'tunnel':''}">${i.method}</span><span class="code ${i.status>=400?'bad':''}">${i.status} ${i.status>=400?'Bad Gateway':'OK'}</span></div><div class="url">https://${esc(host+path)}</div><div class="facts"><div><label>来源设备</label>192.168.1.5</div><div><label>耗时</label>${i.ms} ms</div><div><label>请求时间</label>${i.time}</div><div><label>处理方式</label>${i.method==='CONNECT'?'隧道转发':'真实转发'}</div></div><div class="tabline"><span>概览</span><span class="selected">响应</span><span>请求</span></div><h4>${i.method==='CONNECT'?'连接信息':'响应正文'}</h4><pre>${i.method==='CONNECT'?'此连接未解密。\n没有可展示的明文正文。':i.status>=400?'上游连接提前关闭\nEOF':path==='/'?'&lt;!doctype html&gt;\n&lt;html lang="zh-CN"&gt;\n  &lt;head&gt;…&lt;/head&gt;\n  &lt;body&gt;…&lt;/body&gt;\n&lt;/html&gt;':'{\n  "query": "mockcharles",\n  "suggestions": [ … ]\n}'}</pre><p class="muted" style="font-size:10px">用于比较目录样式的示例内容</p>`}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('#search').oninput=render;$('#scope').onchange=render;$('#collapse').onclick=()=>{collapsed=!collapsed;$('#collapse').textContent=collapsed?'全部展开':'全部折叠';render()};render();showDetail();
</script></html>
